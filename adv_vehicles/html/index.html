<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Vehicles UI</title>
    <link rel="stylesheet" href="hotwire.css">
    <link rel="stylesheet" href="garage.css">
</head>
<body>
    <!-- Hotwire Container -->
    <div id="hotwire-container" style="display: none;">
        <div class="panel">
            <h2>Ignition Wiring</h2>
            <p>Connect the wires to start the engine. Don't cross the wrong ones!</p>
            <div class="wiring-area" id="wiring-area">
                <svg id="wire-svg" width="100%" height="100%" style="position: absolute; top: 0; left: 0; pointer-events: none;"></svg>
                <div class="wires" id="wire-starts">
                    <div class="wire-point start" data-color="red" style="background-color: red;"></div>
                    <div class="wire-point start" data-color="blue" style="background-color: #2196F3;"></div>
                    <div class="wire-point start" data-color="green" style="background-color: #4CAF50;"></div>
                </div>
                <div class="terminals" id="wire-ends">
                    <div class="wire-point end" data-accept="red"></div>
                    <div class="wire-point end" data-accept="blue"></div>
                    <div class="wire-point end" data-accept="green"></div>
                </div>
            </div>
            <div id="status">Waiting for connection...</div>
        </div>
    </div>

    <!-- Garage Container -->
    <div id="garage-container" style="display: none;">
        <div class="header">
            <h2 id="garage-name">Garage</h2>
            <button onclick="closeUI()">X</button>
        </div>
        <div class="vehicle-list" id="vehicle-list">
            <!-- Vehicles injected via JS -->
        </div>
    </div>

    <script src="hotwire.js"></script>
    <script src="garage.js"></script>
</body>
</html>

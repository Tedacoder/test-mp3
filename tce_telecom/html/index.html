<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tha Crack Era - Telecom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;" id="app-root">

    <div id="phone-container" class="os-itones">
        <!-- Hardware Overlays -->
        <div id="damage-overlay" class="hidden"></div>
        <div id="glare-overlay"></div>

        <!-- Hardware Elements (Injected based on OS) -->
        <div id="hardware-notch" class="notch-itones"></div>

        <!-- Phone UI Layout -->
        <div id="mobile-layout" class="theme-light">
            <div id="status-bar">
                <span id="time-display">12:00</span>
                <div class="status-right">
                    <span id="network-signal">5G</span>
                    <span id="battery-indicator">100%</span>
                </div>
            </div>

            <div id="screen-content">
                <!-- Home Screen Grid -->
                <div id="home-screen">
                    <div class="app-grid">
                        <div class="app-icon" data-app="messages"><div class="icon-inner msg-icon"></div>Messages</div>
                        <div class="app-icon" data-app="camera"><div class="icon-inner cam-icon"></div>Camera</div>
                        <div class="app-icon" data-app="photos"><div class="icon-inner photo-icon"></div>Photos</div>
                        <div class="app-icon" data-app="clock"><div class="icon-inner clock-icon"></div>Clock</div>

                        <div class="app-icon" data-app="notes"><div class="icon-inner notes-icon"></div>Notes</div>
                        <div class="app-icon" data-app="calculator"><div class="icon-inner calc-icon"></div>Calculator</div>
                        <div class="app-icon" data-app="settings"><div class="icon-inner set-icon"></div>Settings</div>
                        <div class="app-icon" data-app="gps"><div class="icon-inner gps-icon"></div>Maps</div>

                        <div class="app-icon" data-app="store"><div class="icon-inner store-icon"></div>Store</div>
                        <div class="app-icon" data-app="bank"><div class="icon-inner bank-icon"></div>Bank</div>
                        <div class="app-icon" data-app="whatnot"><div class="icon-inner whatnot-icon"></div>Whatnot</div>
                        <div class="app-icon" data-app="facespace"><div class="icon-inner fb-icon"></div>FaceSpace</div>
                    </div>

                    <!-- Dock (iTones specific typically) -->
                    <div id="app-dock">
                        <div class="app-icon" data-app="phone"><div class="icon-inner phone-icon"></div></div>
                        <div class="app-icon" data-app="browser"><div class="icon-inner web-icon"></div></div>
                        <div class="app-icon" data-app="mail"><div class="icon-inner mail-icon"></div></div>
                    </div>
                </div>

                <!-- Active App Container -->
                <div id="app-container" class="hidden">
                    <div class="app-header">
                        <button id="btn-home"><- Home</button>
                        <h3 id="app-title">App</h3>
                    </div>
                    <div id="app-body" style="padding: 20px; text-align: center; color: #888;">
                        App functionality under construction.
                    </div>
                </div>
            </div>

            <!-- Hardware Buttons -->
            <div id="physical-buttons">
                <!-- Hidden by default, shown for Star -->
                <button id="btn-privacy" class="hidden">Toggle Privacy Screen</button>
            </div>

            <!-- Home Indicator (iTones bar) -->
            <div id="home-indicator"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

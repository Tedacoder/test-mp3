<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tha Crack Era - Telecom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;" id="app-root">

    <div id="phone-container">
        <!-- Hardware Overlays (Injected via JS) -->
        <div id="damage-overlay" class="hidden"></div>
        <div id="glare-overlay"></div>

        <!-- Phone UI Layout -->
        <div id="mobile-layout" class="theme-dark">
            <div id="status-bar">
                <span id="time-display">12:00</span>
                <span id="network-signal">5G</span>
                <span id="battery-indicator">100%</span>
            </div>

            <div id="screen-content">
                <!-- Lock Screen / Home Screen Grid -->
                <div id="home-screen">
                    <div class="app-grid">
                        <div class="app-icon" data-app="facespace">FaceSpace</div>
                        <div class="app-icon" data-app="instaglam">InstaGlam</div>
                        <div class="app-icon" data-app="soundstream">SoundStream</div>
                    </div>
                </div>

                <!-- Active App Container -->
                <div id="app-container" class="hidden">
                    <!-- Apps inject here -->
                </div>
            </div>

            <!-- Physical / Hardware Buttons -->
            <div id="physical-buttons">
                <button id="btn-home">Home</button>
                <button id="btn-privacy" class="hidden">Privacy</button>
            </div>
        </div>

        <!-- Desktop Mode UI (Star-DeX) -->
        <div id="stardex-layout" class="hidden">
            <!-- Fullscreen Desktop Environment here -->
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link id="themeStylesheet" rel="stylesheet" href="nightclub.css">
    <title>Restaurant Menu</title>
</head>

<body>
    <div id="menu-wrapper" style="display: none;">
        <div class="close-btn" onclick="closeMenu()">X</div>
        <div id="menu-book">

            <div class="page" id="page-left">
                <h1 class="category-title" id="category-left"></h1>
                <div id="items-left"></div>
            </div>

            <div class="page" id="page-right">
                <h1 class="category-title" id="category-right"></h1>
                <div id="items-right"></div>
            </div>

        </div>

        <div id="nav">
            <button id="prevPage">⟵ Previous</button>
            <button id="nextPage">Next ⟶</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: none; background: transparent; height: 100vh; width: 100vw; margin: 0; padding: 0;">

<div id="admin-root" class="fixed inset-0 flex items-center justify-center p-6 font-sans select-none overflow-hidden z-[99999]" style="display: none;">
    <div class="w-[95vw] h-[85vh] max-w-[1600px] max-h-[900px] flex rounded-2xl border border-[rgba(255,255,255,0.08)] bg-[#0c0c10]/95 backdrop-blur-xl shadow-2xl overflow-hidden text-gray-200">

        <!-- Left Sidebar Navigation -->
        <aside class="w-20 flex flex-col justify-between items-center py-6 border-r border-[rgba(255,255,255,0.04)] bg-black/20">
            <div class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-purple-400 to-indigo-500 cursor-pointer" onclick="closeMenu()">
                Ω
            </div>
            <nav class="flex flex-col gap-6 w-full items-center">
                <button class="w-12 h-12 flex items-center justify-center rounded-xl text-white bg-gradient-to-br from-purple-600 to-indigo-600 shadow-[0_0_15px_rgba(147,51,234,0.3)] transition-all"><i class="fas fa-users text-lg"></i></button>
                <button class="w-12 h-12 flex items-center justify-center rounded-xl text-gray-400 hover:text-white transition-all"><i class="fas fa-car text-lg"></i></button>
                <button class="w-12 h-12 flex items-center justify-center rounded-xl text-gray-400 hover:text-white transition-all"><i class="fas fa-file-alt text-lg"></i></button>
                <button class="w-12 h-12 flex items-center justify-center rounded-xl text-gray-400 hover:text-white transition-all"><i class="fas fa-cog text-lg"></i></button>
            </nav>
            <div class="flex flex-col items-center gap-2 p-3 w-16 rounded-xl bg-black/40 border border-[rgba(255,255,255,0.03)] text-center">
                <div class="text-[10px] uppercase tracking-wider text-purple-400 font-bold">Vitals</div>
                <div id="vitalsCount" class="text-sm font-black text-white">0</div>
                <div class="text-[9px] text-gray-500 font-medium">Players</div>
            </div>
        </aside>

        <!-- Player List -->
        <section class="w-[32%] p-6 flex flex-col gap-4 border-r border-[rgba(255,255,255,0.04)]">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold tracking-wide uppercase text-gray-300">Player List</h2>
                <span class="text-xs px-2 py-1 rounded bg-white/5 border border-white/10 text-gray-400 font-mono">ID / Name</span>
            </div>
            <div id="dynamicPlayerList" class="flex-1 overflow-y-auto pr-1 flex flex-col gap-3 custom-scrollbar">
                <!-- Players will be injected here -->
            </div>
        </section>

        <!-- Player Inspector -->
        <section class="w-[38%] p-6 flex flex-col gap-5 border-r border-[rgba(255,255,255,0.04)] bg-black/[0.05]">
            <div class="flex gap-4 items-center">
                <div class="w-20 h-20 flex items-center justify-center bg-zinc-900/50 rounded-xl overflow-hidden border border-white/5 relative">
                    <img id="inspectorAvatar" src="images/default_avatar.png" class="w-full h-full object-cover scale-110" alt="Character Face Link" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png';"/>
                </div>
                <div>
                    <h2 class="text-xs uppercase tracking-wider text-gray-500 font-bold">Player Inspector</h2>
                    <div class="text-xl font-black text-white tracking-wide mt-0.5"><span id="inspectorName">Select a player</span> <span id="inspectorId" class="text-purple-400 font-mono text-sm ml-1"></span></div>
                    <div id="inspectorJob" class="text-sm text-gray-400 font-medium tracking-wide"></div>
                </div>
            </div>

            <!-- Inventory -->
            <div class="flex-1 flex flex-col gap-3">
                <div class="text-xs uppercase font-bold tracking-widest text-gray-400 flex justify-between items-center">
                    <span>ox_inventory</span>
                    <span class="text-gray-600 font-mono">Right-click to remove</span>
                </div>
                <div id="dynamicInventoryGrid" class="grid grid-cols-5 gap-2 p-3 rounded-xl border border-white/5 bg-black/30 overflow-y-auto custom-scrollbar max-h-[300px]">
                    <!-- Inventory slots injected here -->
                </div>
            </div>

            <!-- Quick Controls -->
            <div class="flex flex-col gap-2">
                <h4 class="text-xs font-bold uppercase text-gray-500 tracking-wider">Quick Controls</h4>
                <div class="grid grid-cols-2 gap-2 overflow-y-auto max-h-[150px] custom-scrollbar pr-1">
                    <button id="btnHeal" class="py-2 rounded-xl border border-emerald-500/20 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-heart-beat mr-2"></i>Heal</button>
                    <button id="btnSpectate" class="py-2 rounded-xl border border-amber-500/20 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-eye mr-2"></i>Spectate</button>
                    <button id="btnFreeze" class="py-2 rounded-xl border border-cyan-500/20 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-snowflake mr-2"></i>Freeze</button>
                    <button id="btnBan" class="py-2 rounded-xl border border-rose-600/20 bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-gavel mr-2"></i>Ban Player</button>
                    <button id="btnKill" class="py-2 rounded-xl border border-red-500/20 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-skull mr-2"></i>Kill Player</button>
                    <button id="btnBring" class="py-2 rounded-xl border border-blue-400/20 bg-blue-400/10 hover:bg-blue-400/20 text-blue-300 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-people-arrows mr-2"></i>Bring Player</button>
                    <button id="btnGoTo" class="py-2 rounded-xl border border-teal-500/20 bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-location-arrow mr-2"></i>Go To</button>
                    <button id="btnRemoveJob" class="py-2 rounded-xl border border-zinc-500/20 bg-zinc-500/10 hover:bg-zinc-500/20 text-zinc-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-user-times mr-2"></i>Remove Job</button>

                    <button id="btnKick" class="py-2 rounded-xl border border-orange-500/20 bg-orange-500/10 hover:bg-orange-500/20 text-orange-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-user-slash mr-2"></i>Kick Player</button>
                    <button id="btnWarn" class="py-2 rounded-xl border border-yellow-500/20 bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-exclamation-triangle mr-2"></i>Warn Player</button>
                    <button id="btnUndo" class="py-2 rounded-xl border border-pink-500/20 bg-pink-500/10 hover:bg-pink-500/20 text-pink-400 font-bold text-xs tracking-wide transition-all active:scale-95 col-span-2"><i class="fas fa-undo mr-2"></i>Undo Last Action</button>

                    <button id="btnGiveMoney" class="py-2 rounded-xl border border-green-500/20 bg-green-500/10 hover:bg-green-500/20 text-green-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-money-bill-wave mr-2"></i>Give Money</button>
                    <button id="btnGiveClothing" class="py-2 rounded-xl border border-indigo-500/20 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-tshirt mr-2"></i>Give Clothing</button>

                    <button id="btnAddVehicle" class="py-2 rounded-xl border border-blue-500/20 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-car mr-2"></i>Give Vehicle</button>
                    <button id="btnSetJob" class="py-2 rounded-xl border border-purple-500/20 bg-purple-500/10 hover:bg-purple-500/20 text-purple-400 font-bold text-xs tracking-wide transition-all active:scale-95"><i class="fas fa-briefcase mr-2"></i>Set Job</button>
                </div>
            </div>
        </section>

        <!-- Right Dashboard -->
        <section class="w-[30%] p-6 flex flex-col gap-4 bg-black/10">
            <div class="flex justify-between items-center">
                <h2 class="text-xs uppercase tracking-wider text-gray-500 font-bold">Live Streaming Logs</h2>
                <div class="w-2 h-2 rounded-full bg-purple-500 animate-ping"></div>
            </div>
            <div id="dynamicLogs" class="flex-1 p-4 rounded-xl border border-white/5 bg-black/50 font-mono text-[11px] leading-relaxed text-zinc-400 overflow-y-auto custom-scrollbar">
                <!-- Logs injected here -->
            </div>


            <div class="p-4 rounded-xl border border-white/5 bg-black/30 flex flex-col gap-3">
                <div class="text-xs uppercase font-bold tracking-wider text-purple-400">Developer Utils</div>

                <div class="flex flex-col gap-2">
                    <button onclick="copyCoordsToClipboard('vector3')" class="w-full py-2 rounded-lg bg-white/[0.02] hover:bg-purple-600/20 border border-white/5 hover:border-purple-500/30 text-xs text-left px-3 flex justify-between items-center transition-all">
                        <span>Copy Vector3</span>
                        <span class="text-[10px] font-mono text-zinc-500">vec3(x, y, z)</span>
                    </button>

                    <button onclick="copyCoordsToClipboard('vector4')" class="w-full py-2 rounded-lg bg-white/[0.02] hover:bg-purple-600/20 border border-white/5 hover:border-purple-500/30 text-xs text-left px-3 flex justify-between items-center transition-all">
                        <span>Copy Vector4</span>
                        <span class="text-[10px] font-mono text-zinc-500">vec4(x, y, z, h)</span>
                    </button>

                    <button onclick="copyCoordsToClipboard('table')" class="w-full py-2 rounded-lg bg-white/[0.02] hover:bg-purple-600/20 border border-white/5 hover:border-purple-500/30 text-xs text-left px-3 flex justify-between items-center transition-all">
                        <span>Copy Table</span>
                        <span class="text-[10px] font-mono text-zinc-500">{x, y, z, h}</span>
                    </button>
                </div>
            </div>

            <!-- Quick Ref (from previous version) -->
            <div class="p-3 rounded-xl border border-white/5 bg-black/40 flex flex-col gap-2">
                <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Quick Actions</div>
                <div class="flex gap-2">
                    <button onclick="fetch(`https://${GetParentResourceName()}/toggleNoclip`, {method: 'POST', body: JSON.stringify({})})" class="flex-1 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-gray-300">Toggle Noclip</button>
                    <button onclick="fetch(`https://${GetParentResourceName()}/toggleGodMode`, {method: 'POST', body: JSON.stringify({})})" class="flex-1 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-gray-300">God Mode</button>
                </div>
            </div>
        </section>

    </div>
</div>

<div id="toast" class="fixed top-5 right-5 px-6 py-3 rounded-lg bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-500/20 transition-all duration-300 translate-x-[150%] opacity-0 z-[100000]">
    Notification
</div>

<!-- Prompt Modal -->
<div id="promptModal" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-[100000] hidden">
    <div class="w-[400px] p-6 rounded-xl bg-zinc-900 border border-white/10 shadow-2xl">
      <p id="promptTitle" class="mb-4 font-bold text-white text-center"></p>
      <input type="text" id="promptInput" class="w-full p-2 mb-4 rounded bg-black/50 border border-white/10 text-white focus:outline-none focus:border-purple-500" />
      <div class="flex justify-center gap-3">
        <button id="promptConfirm" class="px-6 py-2 rounded bg-purple-600 hover:bg-purple-500 text-white font-bold">OK</button>
        <button id="promptCancel" class="px-6 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-white font-bold">Cancel</button>
      </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

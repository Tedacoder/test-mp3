  <!-- Prompt Modal -->
  <div id="promptModal" class="modal hidden">
    <div class="modal-content" style="text-align: center; max-width: 400px; width: 100%;">
      <p id="promptTitle" style="margin-bottom: 15px; font-weight: bold;"></p>
      <input type="text" id="promptInput" style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;" />
      <div class="modal-actions" style="justify-content: center; gap: 10px;">
        <button id="promptConfirm" style="background: var(--color-primary);">OK</button>
        <button id="promptCancel" style="background: #444;">Cancel</button>
      </div>
    </div>
  </div>
